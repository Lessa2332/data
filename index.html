<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Голосовий журнал</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
    }
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
      background: white;
      cursor: pointer;
    }
    .mic-button {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      font-size: 48px;
      cursor: pointer;
      margin: 30px auto;
      display: block;
      transition: transform 0.2s;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .mic-button:hover { transform: scale(1.05); }
    .mic-button:active { transform: scale(0.95); }
    .mic-button.recording {
      animation: pulse 1.5s infinite;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.7); }
      50% { box-shadow: 0 0 0 20px rgba(245, 87, 108, 0); }
    }
    .status {
      text-align: center;
      color: #666;
      margin: 20px 0;
      font-size: 14px;
    }
    .result {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.6;
    }
    .hint {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #856404;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ Голосовий Журнал</h1>
    <p class="subtitle">Інтелектуальна система оцінювання</p>

    <div class="hint">
      💡 <strong>Приклад:</strong> "Африка географічне положення Ашихмін перша група 11 балів"<br>
      <small>Тему можна диктувати без підкреслення — скрипт знайде сам</small>
    </div>

    <label for="classSelect">Клас:</label>
    <select id="classSelect">
      <optgroup label="5-ті класи">
        <option value="5-А">5-А клас</option>
        <option value="5-Б">5-Б клас</option>
        <option value="5-В">5-В клас</option>
        <option value="5-Г">5-Г клас</option>
        <option value="5-Д">5-Д клас</option>
      </optgroup>
      <optgroup label="7-мі класи">
        <option value="7-А">7-А клас</option>
        <option value="7-Б">7-Б клас</option>
        <option value="7-В">7-В клас</option>
        <option value="7-Г">7-Г клас</option>
        <option value="7-Д">7-Д клас</option>
      </optgroup>
    </select>

    <button id="micButton" class="mic-button">🎤</button>
    <p id="status" class="status">Натисніть кнопку та диктуйте</p>
    <div id="result" class="result" style="display: none;"></div>
  </div>

  <script>
    // ⚠️ ВАЖЛИВО: Встав сюди НОВИЙ URL після розгортання скрипту!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwaLIfxaStKrve4Q2RjWklQpwzfKiTff0wN-f4_vqJ9TE8Fp5Pv846ZZeS70hzuWfIlzg/exec";
    const TOKEN = "Вчитель2026_СекретнийПароль!#";

    const micButton = document.getElementById('micButton');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const classSelect = document.getElementById('classSelect');

    let recognition;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'uk-UA';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        micButton.classList.add('recording');
        status.textContent = '🔴 Слухаю...';
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        status.textContent = '✅ Почув: "' + transcript + '"';
        await sendToServer(transcript);
      };

      recognition.onerror = (event) => {
        status.textContent = '❌ Помилка: ' + event.error;
        micButton.classList.remove('recording');
        isRecording = false;
      };

      recognition.onend = () => {
        micButton.classList.remove('recording');
        isRecording = false;
      };
    } else {
      status.textContent = '❌ Ваш браузер не підтримує голосове введення';
      micButton.disabled = true;
    }

    micButton.addEventListener('click', () => {
      if (!recognition) return;
      
      if (isRecording) {
        recognition.stop();
      } else {
        result.style.display = 'none';
        recognition.start();
      }
    });

    async function sendToServer(text) {
      status.textContent = '⏳ Обробляю...';
      
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            token: TOKEN,
            className: classSelect.value,
            rawText: text
          })
        });

        const message = await response.text();
        result.textContent = message;
        result.style.display = 'block';
        status.textContent = '✅ Готово!';
      } catch (error) {
        result.textContent = '❌ Помилка з\'єднання: ' + error.message;
        result.style.display = 'block';
        status.textContent = '❌ Помилка';
      }
    }
  </script>
</body>
</html>
