<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовий журнал Паралелі Класів</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 30px; background: #f0f4f8; color: #333; }
        .container { max-width: 550px; margin: 0 auto; background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { color: #2c3e50; margin-bottom: 10px; font-size: 26px; }
        .btn { padding: 18px; font-size: 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 12px; width: 100%; font-weight: bold; margin-top: 15px; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(0,123,255,0.2); }
        .btn:hover { background: #0056b3; }
        .btn.ready { background: #e74c3c; box-shadow: 0 4px 15px rgba(231,76,60,0.4); animation: pulse 1.5s infinite; }
        .btn.wait { background: #95a5a6; cursor: not-allowed; box-shadow: none; }
        #status { margin-top: 25px; font-size: 16px; color: #7f8c8d; font-style: italic; font-weight: 500; }
        #result { margin-top: 15px; font-weight: bold; font-size: 22px; color: #2c3e50; min-height: 40px; background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 5px solid #007bff; text-align: left; word-wrap: break-word; }
        .settings-section { margin-bottom: 20px; text-align: left; background: #f8f9fa; padding: 20px; border-radius: 12px; display: flex; gap: 15px; border: 1px solid #e9ecef; }
        .form-group { flex: 1; }
        .form-group label { font-weight: bold; display: block; margin-bottom: 8px; color: #495057; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;}
        .form-input { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ced4da; box-sizing: border-box; background: white; transition: border 0.2s; }
        .form-input:focus { border-color: #007bff; outline: none; }
        .hint { background: #e3f2fd; color: #0d47a1; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 15px; text-align: left; line-height: 1.5; border-left: 5px solid #2196f3; }
        .error-text { color: #e74c3c !important; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ ШІ-Голосовий Журнал</h2>
    
    <div class="hint">
        🚀 <strong>Повна свобода мови:</strong> Говоріть абсолютно природно. ШІ сам знайде прізвище, групу та оцінку.<br>
        <i>Наприклад: "Левченко перша група одинадцять балів" або "Постав десятку для Кузьміна у другу групу".</i>
    </div>
    
    <div class="settings-section">
        <div class="form-group">
            <label for="class-select">Оберіть клас:</label>
            <select id="class-select" class="form-input">
                <option value="6-А">6-А клас</option>
                <option value="6-Б">6-Б клас</option>
                <option value="6-В">6-В клас</option>
                <option value="6-Г">6-Г клас</option>
                <option value="6-Д">6-Д клас</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="lesson-date">Дата оцінювання:</label>
            <input type="date" id="lesson-date" class="form-input">
        </div>
    </div>
    
    <button id="start-btn" class="btn">🎙️ Увімкнути мікрофон</button>
    <div id="status">Очікування активації...</div>
    <div id="result">Тут з'явиться розпізнаний текст...</div>
</div>

<script>
    // Посилання на ваш Google Скрипт та пароль
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwA9283RKkIJNrJ2r8ZCXMeNRLNSOTGM3ONIjVCKWlVAkfNL2fQY1pTcGxJ9Pea0XiHvA/exec"; 
    const SECRET_TOKEN = "Вчитель2026_СекретнийПароль!#"; 

    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const dateInput = document.getElementById('lesson-date');
    const classSelect = document.getElementById('class-select');

    // Автоматичне встановлення сьогоднішньої дати
    dateInput.value = new Date().toISOString().split('T')[0];

    let isActive = false;     
    let isSpeaking = false;   

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        statusDiv.innerText = "Помилка: Браузер не підтримує розпізнавання мови.";
        startBtn.disabled = true;
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'uk-UA';
        recognition.interimResults = false;

        startBtn.addEventListener('click', () => {
            if (!isActive) {
                isActive = true;
                statusDiv.classList.remove('error-text');
                setVisualState("listening");
                safeStart();
            } else {
                isActive = false;
                setVisualState("stopped");
                recognition.stop();
            }
        });

        function setVisualState(state) {
            if (state === "listening") {
                startBtn.className = "btn ready";
                startBtn.innerText = "🔴 Мікрофон АКТИВНИЙ...";
                statusDiv.innerText = "Диктуйте у вільному форматі...";
            } else if (state === "waiting") {
                startBtn.className = "btn wait";
                startBtn.innerText = "🧠 ШІ аналізує фразу...";
            } else {
                startBtn.className = "btn";
                startBtn.innerText = "🎙️ Увімкнути мікрофон";
                statusDiv.innerText = "Журнал зупинено.";
            }
        }

        function safeStart() {
            if (isActive && !isSpeaking) {
                try { 
                    recognition.start(); 
                    setVisualState("listening");
                } catch(e) {}
            }
        }

        recognition.onend = () => {
            if (isActive && !isSpeaking) {
                setTimeout(safeStart, 500); 
            }
        };

        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            resultDiv.innerText = `Почуто: "${text}"`;

            const selectedDate = dateInput.value;
            const selectedClass = classSelect.value;

            // Зупиняємо мікрофон на час обробки
            isSpeaking = true;
            setVisualState("waiting");
            recognition.stop();
            
            // Надсилаємо ВЕСЬ текст у Google Таблицю для ШІ
            sendToGoogleSheet(text, selectedDate, selectedClass);
        };

        recognition.onerror = (e) => {
            if (e.error === 'no-speech') safeStart();
        };
    }

    function sendToGoogleSheet(rawText, date, className) {
        statusDiv.innerText = `Надсилаю до Google-сервера...`;
        
        // Використовуємо ТЕКСТОВИЙ тип відправки, щоб уникнути блокувань браузера (CORS)
        fetch(WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ rawText, date, className, token: SECRET_TOKEN })
        })
        .then(response => response.text())
        .then(responseText => {
            statusDiv.classList.remove('error-text');
            
            // Якщо сервер повернув повідомлення про помилку розпізнання ШІ
            if (responseText.includes("Помилка")) {
                statusDiv.classList.add('error-text');
                statusDiv.innerText = responseText;
                speak("Не розпізнано.", () => {
                    isSpeaking = false;
                    setTimeout(safeStart, 1000);
                });
            } else {
                // Успішний запис! Повертає текст на кшталт "Успішно внесено (Схожість: 95%)"
                statusDiv.innerText = responseText;
                resultDiv.innerText = `🎉 Дані успішно додано в таблицю!`;
                
                speak("Записано.", () => {
                    isSpeaking = false;
                    setTimeout(safeStart, 1000); 
                });
            }
        })
        .catch(error => {
            statusDiv.classList.add('error-text');
            statusDiv.innerText = "Помилка зв'язку з сервером.";
            speak("Помилка.", () => {
                isSpeaking = false;
                setTimeout(safeStart, 1000);
            });
        });
    }

    function speak(message, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = 'uk-UA';
            if (callback) utterance.onend = callback; 
            window.speechSynthesis.speak(utterance);
        } else if (callback) {
            callback();
        }
    }
</script>
</body>
</html>
