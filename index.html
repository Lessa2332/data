<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Голосовий журнал НУШ 2026</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 40px; background: #f4f7f6; color: #333; }
        .container { max-width: 550px; margin: 0 auto; background: white; padding: 35px; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.06); }
        .btn { padding: 18px; font-size: 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 15px; transition: background 0.2s; }
        .btn:hover { background: #0056b3; }
        #status { margin-top: 25px; font-size: 16px; color: #666; font-style: italic; }
        #result { margin-top: 15px; font-weight: bold; font-size: 22px; color: #28a745; min-height: 30px; }
        .date-section { margin-bottom: 25px; text-align: left; background: #eef2f7; padding: 15px; border-radius: 8px; }
        .date-section label { font-weight: bold; display: block; margin-bottom: 8px; color: #495057;}
        .date-input { width: 95%; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ced4da; }
        .hint { background: #fff3cd; color: #856404; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; text-align: left; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ Голосовий е-Журнал НУШ</h2>
    
    <div class="hint">
        <strong>Як диктувати:</strong> Натисніть кнопку, зробіть мікропаузу і чітко скажіть прізвище, групу результатів та бал.<br>
        <i>Наприклад: "Коваленко гр 2 десять" або "Петренко перша група 11"</i>
    </div>
    
    <div class="date-section">
        <label for="lesson-date">Дата уроку / оцінювання:</label>
        <input type="date" id="lesson-date" class="date-input">
    </div>
    
    <button id="start-btn" class="btn">Увімкнути мікрофон</button>
    <div id="status">Очікування активації...</div>
    <div id="result"></div>
</div>

<script>
    // Ваша адреса макросу Google
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzejyaoys5axyR0k-DPFAOPklKp3WDrviRw1_2178sagzes9QKKKDtYJ-DKrn_xooj5FA/exec"; 
    // Пароль захисту (ідентичний тому, що в хмарі)
    const SECRET_TOKEN = "Вчитель2026_СекретнийПароль!#"; 

    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const dateInput = document.getElementById('lesson-date');

    // Встановлення поточної дати за замовчуванням
    dateInput.value = new Date().toISOString().split('T')[0];

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        statusDiv.innerText = "Помилка: Ваш браузер не підтримує розпізнавання мови. Відкрийте файл через Google Chrome.";
        startBtn.disabled = true;
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'uk-UA';

        startBtn.addEventListener('click', () => {
            recognition.start();
            statusDiv.innerText = "Слухаю... Назвіть Прізвище, ГР та Оцінку.";
            startBtn.style.background = "#dc3545";
            startBtn.innerText = "🔴 Мікрофон записує...";
        });

        recognition.onspeechend = () => {
            recognition.stop();
            startBtn.style.background = "#007bff";
            startBtn.innerText = "Увімкнути мікрофон";
        };

        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            resultDiv.innerText = `Почуто: "${text}"`;
            
            const parts = text.split(/[\s,]+/); 
            
            if (parts.length >= 3) {
                const surname = parts[0];
                const grade = parts[parts.length - 1];
                const group = parts.slice(1, parts.length - 1).join(" ");
                const selectedDate = dateInput.value;

                sendToGoogleSheet(surname, group, grade, selectedDate);
            } else {
                statusDiv.innerText = "Помилка розпізнавання формату.";
                speak("Не почула команду повністю. Повторіть, будь ласка.");
            }
        };

        recognition.onerror = (e) => {
            startBtn.style.background = "#007bff";
            startBtn.innerText = "Увімкнути мікрофон";
            statusDiv.innerText = `Помилка мікрофона: ${e.error}`;
        };
    }

    function sendToGoogleSheet(surname, group, grade, date) {
        statusDiv.innerText = `Надсилання даних для ${surname}...`;
        
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ surname, group, grade, date, token: SECRET_TOKEN })
        })
        .then(() => {
            statusDiv.innerText = "Готово! Запис оновлено.";
            const dayMonth = date.split('-').reverse().slice(0,2).join('.');
            resultDiv.innerText = `Успішно: ${surname} ➔ ${group} ➔ Бал: ${grade}`;
            
            // Голосовий звіт системи для контролю на слух
            speak(`Учня ${surname} записано, оцінка ${grade}`);
        })
        .catch(error => {
            statusDiv.innerText = "Помилка з'єднання зі скриптом.";
            speak("Помилка відправки.");
        });
    }

    function speak(message) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = 'uk-UA';
            window.speechSynthesis.speak(utterance);
        }
    }
</script>
</body>
</html>
