<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Голосовий журнал Паралелі Класів</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 30px; background: #f4f7f6; color: #333; }
        .container { max-width: 550px; margin: 0 auto; background: white; padding: 35px; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.06); }
        .btn { padding: 18px; font-size: 20px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 15px; transition: all 0.2s; }
        .btn.ready { background: #dc3545; animation: pulse 1.5s infinite; }
        .btn.wait { background: #6c757d; cursor: not-allowed; }
        #status { margin-top: 25px; font-size: 16px; color: #666; font-style: italic; }
        #result { margin-top: 15px; font-weight: bold; font-size: 22px; color: #0056b3; min-height: 30px; }
        .settings-section { margin-bottom: 20px; text-align: left; background: #eef2f7; padding: 15px; border-radius: 8px; display: flex; gap: 15px; }
        .form-group { flex: 1; }
        .form-group label { font-weight: bold; display: block; margin-bottom: 8px; color: #495057; font-size: 14px;}
        .form-input { width: 100%; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ced4da; box-sizing: border-box; background: white;}
        .hint { background: #fff3cd; color: #856404; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; text-align: left; line-height: 1.4; }
        .error-text { color: #dc3545 !important; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ Автоматичний Голосовий Журнал</h2>
    
    <div class="hint">
        <strong>🔔 Інструкція авторежиму:</strong> Натисніть кнопку. Дочекайтеся, поки вона стане <span style="color:#dc3545; font-weight:bold;">Червоною і запульсує</span> — лише тоді диктуйте. Коли система говорить або зберігає дані, кнопка стає <span style="color:#6c757d; font-weight:bold;">Сірою</span> (у цей момент вона вас не чує).
    </div>
    
    <div class="settings-section">
        <div class="form-group">
            <label for="class-select">Оберіть клас:</label>
            <select id="class-select" class="form-input">
                <option value="6-А">6-A клас</option>
                <option value="6-Б">6-Б клас</option>
                <option value="6-В">6-В клас</option>
                <option value="6-Г">6-Г клас</option>
                <option value="6-Д">6-Д клас</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="lesson-date">Дата оцінювання:</label>
            <input type="date" id="lesson-date" class="form-input">
        </div>
    </div>
    
    <button id="start-btn" class="btn">🎙️ Запустити авторежим</button>
    <div id="status">Очікування активації...</div>
    <div id="result"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby8giywMjAvmIdzfkoFxjgk3VnFLkfl4mBGjck8dW9-nq1ZXOiG4Dob4oZ6bXYjAM36gg/exec"; 
    const SECRET_TOKEN = "Вчитель2026_СекретнийПароль!#"; 

    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const dateInput = document.getElementById('lesson-date');
    const classSelect = document.getElementById('class-select');

    dateInput.value = new Date().toISOString().split('T')[0];

    let isActive = false;     
    let isSpeaking = false;   

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        statusDiv.innerText = "Помилка: Браузер не підтримує розпізнавання мови.";
        startBtn.disabled = true;
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'uk-UA';
        recognition.interimResults = false;

        startBtn.addEventListener('click', () => {
            if (!isActive) {
                isActive = true;
                statusDiv.classList.remove('error-text');
                setVisualState("listening");
                safeStart();
            } else {
                isActive = false;
                setVisualState("stopped");
                recognition.stop();
            }
        });

        function setVisualState(state) {
            if (state === "listening") {
                startBtn.className = "btn ready";
                startBtn.innerText = "🔴 Мікрофон СЛУХАЄ...";
                statusDiv.innerText = "Диктуйте учня (Прізвище -> Група -> Бал)...";
            } else if (state === "waiting") {
                startBtn.className = "btn wait";
                startBtn.innerText = "⏳ Обробка / Озвучування...";
            } else {
                startBtn.className = "btn";
                startBtn.innerText = "🎙️ Запустити авторежим";
                statusDiv.innerText = "Журнал зупинено.";
            }
        }

        function safeStart() {
            if (isActive && !isSpeaking) {
                try { 
                    recognition.start(); 
                    setVisualState("listening");
                } catch(e) { /* Вже працює */ }
            }
        }

        recognition.onend = () => {
            if (isActive && !isSpeaking) {
                // ⏳ Даємо 800мс паузи, щоб очистити аудіо-буфер перед новим стартом
                setTimeout(safeStart, 800); 
            }
        };

        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            resultDiv.innerText = `Почуто: "${text}"`;
            
            const parts = text.split(/[\s,]+/); 
            
            if (parts.length >= 3) {
                const surname = parts[0];
                const grade = parts[parts.length - 1];
                const group = parts.slice(1, parts.length - 1).join(" ");
                
                const groupStr = group.toLowerCase();
                let grValid = false;
                if (groupStr.includes("1") || groupStr.includes("один") || groupStr.includes("перш") ||
                    groupStr.includes("2") || groupStr.includes("два") || groupStr.includes("друг") ||
                    groupStr.includes("3") || groupStr.includes("три") || groupStr.includes("трет") ||
                    groupStr.includes("4") || groupStr.includes("чотир") || groupStr.includes("четверт")) {
                    grValid = true;
                }

                if (!grValid) {
                    statusDiv.classList.add('error-text');
                    statusDiv.innerText = "Помилка: Не розпізнано ГР.";
                    
                    isSpeaking = true;
                    setVisualState("waiting");
                    recognition.stop();
                    speak("Не розпізнано групу.", () => {
                        isSpeaking = false;
                        setTimeout(safeStart, 1000); // Велика пауза після помилки
                    });
                    return; 
                }

                const selectedDate = dateInput.value;
                const selectedClass = classSelect.value;

                isSpeaking = true;
                setVisualState("waiting");
                recognition.stop();
                
                sendToGoogleSheet(surname, group, grade, selectedDate, selectedClass);
            } else {
                statusDiv.classList.add('error-text');
                statusDiv.innerText = "Мало даних для розпізнання.";
                
                isSpeaking = true;
                setVisualState("waiting");
                recognition.stop();
                speak("Повторіть фразу.", () => {
                    isSpeaking = false;
                    setTimeout(safeStart, 1000);
                });
            }
        };

        recognition.onerror = (e) => {
            if (e.error === 'no-speech') {
                // Якщо просто мовчали - м'яко перезапускаємо без зміни дизайну
                safeStart();
            }
        };
    }

    function sendToGoogleSheet(surname, group, grade, date, className) {
        statusDiv.innerText = `Надсилаю [${surname}]...`;
        
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ surname, group, grade, date, className, token: SECRET_TOKEN })
        })
        .then(() => {
            statusDiv.classList.remove('error-text');
            statusDiv.innerText = `Успішно внесено!`;
            resultDiv.innerText = `[${className}] ${surname} ➔ Оцінка: ${grade}`;
            
            speak(`${surname} записано.`, () => {
                isSpeaking = false;
                setTimeout(safeStart, 1000); // 🌟 Фіксована безпечна пауза 1 секунда перед наступним учнем!
            });
        })
        .catch(error => {
            statusDiv.classList.add('error-text');
            statusDiv.innerText = "Помилка мережі.";
            speak("Помилка зв'язку.", () => {
                isSpeaking = false;
                setTimeout(safeStart, 1000);
            });
        });
    }

    function speak(message, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = 'uk-UA';
            if (callback) {
                utterance.onend = callback; 
            }
            window.speechSynthesis.speak(utterance);
        } else if (callback) {
            callback();
        }
    }
</script>
</body>
</html>
