<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Голосовий журнал</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --danger: #ef4444;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --radius: 16px;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-gradient); color: var(--text-main); margin: 0; padding: 16px; min-height: 100vh; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .app-card { width: 100%; max-width: 440px; background: var(--card-bg); padding: 24px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06); }
        h2 { font-size: 22px; font-weight: 800; margin: 0 0 10px 0; }
        .hint { background: #f0fdf4; color: #166534; padding: 14px; border-radius: var(--radius); margin-bottom: 20px; font-size: 14px; border-left: 4px solid #22c55e; }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .form-group label { font-weight: 700; display: block; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; }
        .form-input { width: 100%; height: 48px; padding: 0 12px; font-size: 16px; border-radius: var(--radius); border: 1.5px solid #e5e7eb; background: #f9fafb; box-sizing: border-box; }
        .mic-button-wrapper { position: relative; margin: 20px auto; width: 120px; height: 120px; }
        .btn-mic { width: 100%; height: 100%; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 50%; font-size: 40px; transition: all 0.3s; box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3); }
        .btn-mic.ready { background: var(--danger); box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4); }
        #status { font-size: 14px; color: var(--text-muted); font-weight: 600; text-align: center; margin-top: 10px; min-height: 20px; }
    </style>
</head>
<body>

<div class="app-card">
    <h2>🎙️ Голосовий Журнал</h2>
    <div class="hint">
        <strong>Формат:</strong> <i>Прізвище, група, тема, оцінка.</i><br>
        Приклад: <i>"Петренко, друга група, Африка, 11 балів."</i>
    </div>
    
    <div class="controls-grid">
        <div class="form-group">
            <label for="class-select">Клас</label>
            <select id="class-select" class="form-input">
                <optgroup label="5-ті класи">
                    <option value="Grade_5">5-А</option><option value="Grade_5">5-Б</option>
                    <option value="Grade_5">5-В</option><option value="Grade_5">5-Г</option>
                    <option value="Grade_5">5-Д</option>
                </optgroup>
                <optgroup label="7-мі класи">
                    <option value="Grade_7">7-А</option><option value="Grade_7">7-Б</option>
                    <option value="Grade_7">7-В</option><option value="Grade_7">7-Г</option>
                    <option value="Grade_7">7-Д</option>
                </optgroup>
            </select>
        </div>
        <div class="form-group">
            <label for="lesson-date">Дата</label>
            <input type="date" id="lesson-date" class="form-input">
        </div>
    </div>
    
    <div class="mic-button-wrapper">
        <button id="start-btn" class="btn-mic">🎙️</button>
    </div>
    
    <div id="status">Очікування запуску...</div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwu_vheRBiJmcaBvHHnjKP5UTyfRA6Tpcj8yj_BH-RNoKyriLoHkLRSLmfhl1HsOEF-RQ/exec";
    const SECRET_TOKEN = "Вчитель2026_СекретнийПароль!#";

    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');
    const classSelect = document.getElementById('class-select');
    const dateInput = document.getElementById('lesson-date');
    dateInput.value = new Date().toISOString().split('T')[0];

    let isListening = false;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'uk-UA';

    startBtn.addEventListener('click', () => {
        if (isListening) {
            recognition.stop();
        } else {
            try { recognition.start(); } catch(e) { console.error(e); }
        }
    });

    recognition.onstart = () => {
        isListening = true;
        startBtn.className = "btn-mic ready";
        statusDiv.innerText = "Слухаю...";
    };

    recognition.onend = () => {
        isListening = false;
        startBtn.className = "btn-mic";
    };

    recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        statusDiv.innerText = "Аналіз...";
        fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({ rawText: text, date: dateInput.value, className: classSelect.value, token: SECRET_TOKEN })
        })
        .then(r => r.text())
        .then(res => { statusDiv.innerText = res; });
    };
</script>
</body>
</html>
