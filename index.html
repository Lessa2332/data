<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Голосовий журнал Паралелі Класів</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 30px; background: #f4f7f6; color: #333; }
        .container { max-width: 550px; margin: 0 auto; background: white; padding: 35px; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.06); }
        .btn { padding: 18px; font-size: 20px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 15px; transition: all 0.2s; }
        .btn.ready { background: #dc3545; animation: pulse 1.5s infinite; }
        .btn.wait { background: #6c757d; cursor: not-allowed; }
        #status { margin-top: 25px; font-size: 16px; color: #666; font-style: italic; }
        #result { margin-top: 15px; font-weight: bold; font-size: 22px; color: #0056b3; min-height: 30px; }
        .settings-section { margin-bottom: 20px; text-align: left; background: #eef2f7; padding: 15px; border-radius: 8px; display: flex; gap: 15px; }
        .form-group { flex: 1; }
        .form-group label { font-weight: bold; display: block; margin-bottom: 8px; color: #495057; font-size: 14px;}
        .form-input { width: 100%; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ced4da; box-sizing: border-box; background: white;}
        .hint { background: #fff3cd; color: #856404; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; text-align: left; line-height: 1.4; }
        .error-text { color: #dc3545 !important; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ Розумний Голосовий Журнал</h2>
    
    <div class="hint">
        <strong>Формула вимови:</strong> [Прізвище] + [слово "група" та номер] + [оцінка].<br>
        <i>Наприклад: "Войтех група 1 десять" або "Кузьмін група один дванадцять"</i>
    </div>
    
    <div class="settings-section">
        <div class="form-group">
            <label for="class-select">Оберіть клас:</label>
            <select id="class-select" class="form-input">
                <option value="5-Б">5-Б клас</option>
                <option value="6-А">6-A клас</option>
                <option value="6-Б">6-Б клас</option>
                <option value="6-В">6-В клас</option>
                <option value="6-Г">6-Г клас</option>
                <option value="6-Д">6-Д клас</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="lesson-date">Дата оцінювання:</label>
            <input type="date" id="lesson-date" class="form-input">
        </div>
    </div>
    
    <button id="start-btn" class="btn">🎙️ Запустити авторежим</button>
    <div id="status">Очікування активації...</div>
    <div id="result"></div>
</div>

<script>
    // Ваше нове актуальне посилання на веб-додаток Google Скрипту
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxI_X9T8V2bU1_O9X8y9qa5MIwJWFF56tHdjvDPtsSykCZ4zXDRU9QGOb0Elgm2DXeD5A/exec"; 
    const SECRET_TOKEN = "Вчитель2026_СекретнийПароль!#"; 

    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const dateInput = document.getElementById('lesson-date');
    const classSelect = document.getElementById('class-select');

    dateInput.value = new Date().toISOString().split('T')[0];

    let isActive = false;     
    let isSpeaking = false;   

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        statusDiv.innerText = "Помилка: Браузер не підтримує розпізнавання мови.";
        startBtn.disabled = true;
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'uk-UA';
        recognition.interimResults = false;

        startBtn.addEventListener('click', () => {
            if (!isActive) {
                isActive = true;
                statusDiv.classList.remove('error-text');
                setVisualState("listening");
                safeStart();
            } else {
                isActive = false;
                setVisualState("stopped");
                recognition.stop();
            }
        });

        function setVisualState(state) {
            if (state === "listening") {
                startBtn.className = "btn ready";
                startBtn.innerText = "🔴 Мікрофон СЛУХАЄ...";
                statusDiv.innerText = "Диктуйте учня...";
            } else if (state === "waiting") {
                startBtn.className = "btn wait";
                startBtn.innerText = "⏳ Збереження та озвучка...";
            } else {
                startBtn.className = "btn";
                startBtn.innerText = "🎙️ Запустити авторежим";
                statusDiv.innerText = "Журнал зупинено.";
            }
        }

        function safeStart() {
            if (isActive && !isSpeaking) {
                try { 
                    recognition.start(); 
                    setVisualState("listening");
                } catch(e) {}
            }
        }

        recognition.onend = () => {
            if (isActive && !isSpeaking) {
                setTimeout(safeStart, 600); 
            }
        };

        function normalizeGroup(g) {
            g = g.toLowerCase();
            if (g.includes("1") || g.includes("один") || g.includes("перш")) return "1";
            if (g.includes("2") || g.includes("два") || g.includes("друг")) return "2";
            if (g.includes("3") || g.includes("три") || g.includes("трет")) return "3";
            if (g.includes("4") || g.includes("чотир") || g.includes("четверт")) return "4";
            return g;
        }

        function triggerError(msg) {
            statusDiv.classList.add('error-text');
            statusDiv.innerText = msg;
            isSpeaking = true;
            setVisualState("waiting");
            recognition.stop();
            speak("Повторіть фразу.", () => {
                isSpeaking = false;
                setTimeout(safeStart, 800);
            });
        }

        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            resultDiv.innerText = `Почуто: "${text}"`;

            let textLower = text.toLowerCase().trim();
            
            // Ліквідуємо зливання дефісом від Google (наприклад, "2-10" -> "2 10")
            let cleanTextLower = textLower.replace(/(\d+)\s*[-–—]\s*(\d+)/g, '$1 $2');
            
            // Шукаємо маркер групи
            let keywords = ["група", "групи", "груп", "гр "];
            let keywordIndex = -1;
            let foundKeyword = "";
            
            for (let kw of keywords) {
                let idx = cleanTextLower.indexOf(kw);
                if (idx !== -1) {
                    keywordIndex = idx;
                    foundKeyword = kw;
                    break;
                }
            }
            
            if (keywordIndex !== -1) {
                // Вирізаємо прізвище з ОРИГІНАЛЬНОГО тексту, щоб зберегти великі літери
                const surname = text.substring(0, keywordIndex).trim();
                
                // Беремо все, що після слова "група"
                const afterGroup = cleanTextLower.substring(keywordIndex + foundKeyword.length).trim();
                const tokens = afterGroup.split(/\s+/); // ділимо по пробілах
                
                if (tokens.length >= 2) {
                    const rawGroup = tokens[0];
                    const grade = tokens.slice(1).join(" "); // Все решта — оцінка
                    
                    const group = normalizeGroup(rawGroup); 
                    const selectedDate = dateInput.value;
                    const selectedClass = classSelect.value;

                    isSpeaking = true;
                    setVisualState("waiting");
                    recognition.stop();
                    
                    sendToGoogleSheet(surname, group, grade, selectedDate, selectedClass);
                } else {
                    triggerError("Не розпізнано оцінку. Повторіть.");
                }
            } else {
                triggerError("Скажіть слово 'група' після прізвища.");
            }
        };

        recognition.onerror = (e) => {
            if (e.error === 'no-speech') safeStart();
        };
    }

    function sendToGoogleSheet(surname, group, grade, date, className) {
        statusDiv.innerText = `Надсилаю дані для ${surname}...`;
        
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ surname, group, grade, date, className, token: SECRET_TOKEN })
        })
        .then(() => {
            statusDiv.classList.remove('error-text');
            statusDiv.innerText = `Успішно внесено!`;
            resultDiv.innerText = `[${className}] ${surname} ➔ Гр. ${group} ➔ Оцінка: ${grade}`;
            
            speak(`${surname} записано.`, () => {
                isSpeaking = false;
                setTimeout(safeStart, 1000); 
            });
        })
        .catch(error => {
            statusDiv.classList.add('error-text');
            statusDiv.innerText = "Помилка зв'язку з таблицею.";
            speak("Помилка зв'язку.", () => {
                isSpeaking = false;
                setTimeout(safeStart, 1000);
            });
        });
    }

    function speak(message, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = 'uk-UA';
            if (callback) utterance.onend = callback; 
            window.speechSynthesis.speak(utterance);
        } else if (callback) {
            callback();
        }
    }
</script>
</body>
</html>
