<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Голосовий журнал</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      background: white;
      cursor: pointer;
    }
    .mic-button {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      font-size: 48px;
      cursor: pointer;
      margin: 25px auto;
      display: block;
      transition: transform 0.2s;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .mic-button:hover { transform: scale(1.05); }
    .mic-button:active { transform: scale(0.95); }
    .mic-button.recording {
      animation: pulse 1.5s infinite;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.7); }
      50% { box-shadow: 0 0 0 20px rgba(245, 87, 108, 0); }
    }
    .status {
      text-align: center;
      color: #666;
      margin: 15px 0;
      font-size: 14px;
    }
    .result {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.6;
    }
    .hint {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      padding: 10px 12px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 13px;
      color: #1565c0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ Голосовий Журнал</h1>
    <p class="subtitle">Оберіть клас і тему, диктуйте прізвище + бал</p>

    <div class="hint">
      💡 <strong>Приклад:</strong> "Ашихмін 11 балів"
    </div>

    <div class="form-group">
      <label for="classSelect">Клас:</label>
      <select id="classSelect">
        <optgroup label="5-ті класи">
          <option value="Grade_5">5-А</option>
          <option value="Grade_5">5-Б</option>
          <option value="Grade_5">5-В</option>
          <option value="Grade_5">5-Г</option>
          <option value="Grade_5">5-Д</option>
        </optgroup>
        <optgroup label="7-мі класи">
          <option value="Grade_7" selected>7-А</option>
          <option value="Grade_7">7-Б</option>
          <option value="Grade_7">7-В</option>
          <option value="Grade_7">7-Г</option>
          <option value="Grade_7">7-Д</option>
        </optgroup>
      </select>
    </div>

    <div class="form-group">
      <label for="topicSelect">Тема уроку:</label>
      <select id="topicSelect">
        <option value="">— Завантаження... —</option>
      </select>
    </div>

    <button id="micButton" class="mic-button">🎤</button>
    <p id="status" class="status">Натисніть кнопку та диктуйте прізвище і бал</p>
    <div id="result" class="result" style="display: none;"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbMwW0SJz72IGXAlV-xsft7whu5_0hSneoe-bAbwfbatcMWtNrO635y04V80mv6Wj0Bw/exec";
    const TOKEN = "Вчитель2026_СекретнийПароль!#";
    const MONITOR_KEY = "MyGeoTrackSecret2026";

    const classSelect = document.getElementById('classSelect');
    const topicSelect = document.getElementById('topicSelect');
    const micButton = document.getElementById('micButton');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    let recognition;
    let isRecording = false;

    async function loadTopics() {
      const sheetName = classSelect.value;
      topicSelect.innerHTML = '<option value="">Завантаження...</option>';

      try {
        const url = `${SCRIPT_URL}?action=getTopics&key=${MONITOR_KEY}&sheet=${encodeURIComponent(sheetName)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          topicSelect.innerHTML = '<option value="">Помилка</option>';
          return;
        }

        topicSelect.innerHTML = '<option value="">— Оберіть тему —</option>';
        if (data.topics && data.topics.length > 0) {
          data.topics.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.value;
            opt.textContent = t.display;
            topicSelect.appendChild(opt);
          });
        } else {
          topicSelect.innerHTML = '<option value="">Немає тем</option>';
        }
      } catch(err) {
        topicSelect.innerHTML = '<option value="">Помилка завантаження</option>';
        console.error(err);
      }
    }

    classSelect.addEventListener('change', loadTopics);
    loadTopics();

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'uk-UA';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        micButton.classList.add('recording');
        status.textContent = '🔴 Слухаю...';
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        status.textContent = '✅ Почув: "' + transcript + '"';
        await sendToServer(transcript);
      };

      recognition.onerror = (event) => {
        status.textContent = '❌ Помилка: ' + event.error;
        micButton.classList.remove('recording');
        isRecording = false;
      };

      recognition.onend = () => {
        micButton.classList.remove('recording');
        isRecording = false;
      };
    } else {
      status.textContent = '❌ Ваш браузер не підтримує голосове введення';
      micButton.disabled = true;
    }

    micButton.addEventListener('click', () => {
      if (!recognition) return;
      
      if (!topicSelect.value) {
        alert('Будь ласка, оберіть тему уроку!');
        return;
      }
      
      if (isRecording) {
        recognition.stop();
      } else {
        result.style.display = 'none';
        recognition.start();
      }
    });

    async function sendToServer(text) {
      status.textContent = '⏳ Обробляю...';
      
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            token: TOKEN,
            className: classSelect.value,
            topic: topicSelect.value,
            rawText: text
          })
        });

        const message = await response.text();
        result.textContent = message;
        result.style.display = 'block';
        status.textContent = '✅ Готово!';
      } catch (error) {
        result.textContent = '❌ Помилка з\'єднання: ' + error.message;
        result.style.display = 'block';
        status.textContent = '❌ Помилка';
      }
    }
  </script>
</body>
</html>
