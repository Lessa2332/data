<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Голосовий журнал Паралелі Класів</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 30px; background: #f4f7f6; color: #333; }
        .container { max-width: 550px; margin: 0 auto; background: white; padding: 35px; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.06); }
        .btn { padding: 18px; font-size: 20px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 15px; transition: background 0.2s; }
        .btn:hover { background: #218838; }
        #status { margin-top: 25px; font-size: 16px; color: #666; font-style: italic; }
        #result { margin-top: 15px; font-weight: bold; font-size: 22px; color: #0056b3; min-height: 30px; }
        .settings-section { margin-bottom: 20px; text-align: left; background: #eef2f7; padding: 15px; border-radius: 8px; display: flex; gap: 15px; }
        .form-group { flex: 1; }
        .form-group label { font-weight: bold; display: block; margin-bottom: 8px; color: #495057; font-size: 14px;}
        .form-input { width: 100%; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ced4da; box-sizing: border-box; background: white;}
        .hint { background: #fff3cd; color: #856404; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; text-align: left; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ Багатокласовий Голосовий Журнал</h2>
    
    <div class="hint">
        <strong>Формат команди:</strong> Оберіть клас та дату, натисніть кнопку і чітко диктуйте.<br>
        <i>Наприклад: "Сидоренко гр 4 дванадцять" або "Петренко перша група 10"</i>
    </div>
    
    <div class="settings-section">
        <div class="form-group">
            <label for="class-select">Оберіть клас:</label>
            <select id="class-select" class="form-input">
                <option value="5-А">6-А клас</option>
                <option value="5-Б">6-Б клас</option>
                <option value="5-В">6-В клас</option>
                <option value="5-Г">6-Г клас</option>
                <option value="5-Д">6-Д клас</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="lesson-date">Дата оцінювання:</label>
            <input type="date" id="lesson-date" class="form-input">
        </div>
    </div>
    
    <button id="start-btn" class="btn">🎙️ Увімкнути мікрофон</button>
    <div id="status">Очікування активації...</div>
    <div id="result"></div>
</div>

<script>
    // 🔗 Ваша ОНОВЛЕНА адреса макросу Google
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby8giywMjAvmIdzfkoFxjgk3VnFLkfl4mBGjck8dW9-nq1ZXOiG4Dob4oZ6bXYjAM36gg/exec"; 
    // 🔒 Пароль захисту (ідентичний тому, що в Apps Script)
    const SECRET_TOKEN = "Вчитель2026_СекретнийПароль!#"; 

    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const dateInput = document.getElementById('lesson-date');
    const classSelect = document.getElementById('class-select');

    // Встановлення поточної дати за замовчуванням
    dateInput.value = new Date().toISOString().split('T')[0];

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        statusDiv.innerText = "Помилка: Браузер не підтримує розпізнавання мови. Відкрийте через Google Chrome.";
        startBtn.disabled = true;
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'uk-UA';

        startBtn.addEventListener('click', () => {
            recognition.start();
            statusDiv.innerText = `Слухаю для журналу ${classSelect.value}... Назвіть дані.`;
            startBtn.style.background = "#dc3545";
            startBtn.innerText = "🔴 Мікрофон записує...";
        });

        recognition.onspeechend = () => {
            recognition.stop();
            startBtn.style.background = "#28a745";
            startBtn.innerText = "🎙️ Увімкнути мікрофон";
        };

        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            resultDiv.innerText = `Почуто: "${text}"`;
            
            const parts = text.split(/[\s,]+/); 
            
            if (parts.length >= 3) {
                const surname = parts[0];
                const grade = parts[parts.length - 1];
                const group = parts.slice(1, parts.length - 1).join(" ");
                const selectedDate = dateInput.value;
                const selectedClass = classSelect.value;

                sendToGoogleSheet(surname, group, grade, selectedDate, selectedClass);
            } else {
                statusDiv.innerText = "Неповні дані. Повторіть чіткіше.";
                speak("Повторіть будь ласка фразу.");
            }
        };

        recognition.onerror = (e) => {
            startBtn.style.background = "#28a745";
            startBtn.innerText = "🎙️ Увімкнути мікрофон";
            statusDiv.innerText = `Помилка: ${e.error}`;
        };
    }

    function sendToGoogleSheet(surname, group, grade, date, className) {
        statusDiv.innerText = `Надсилаю дані в журнал класу ${className}...`;
        
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ surname, group, grade, date, className, token: SECRET_TOKEN })
        })
        .then(() => {
            statusDiv.innerText = `Успішно внесено в аркуш ${className}!`;
            const dayMonth = date.split('-').reverse().slice(0,2).join('.');
            resultDiv.innerText = `[${className}] ${surname} ➔ ${group} ➔ Оцінка: ${grade}`;
            
            // Голосовий звіт системи для контролю на слух
            speak(`Клас ${className}, учень ${surname} записано.`);
        })
        .catch(error => {
            statusDiv.innerText = "Помилка зв'язку.";
            speak("Помилка відправки.");
        });
    }

    function speak(message) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = 'uk-UA';
            window.speechSynthesis.speak(utterance);
        }
    }
</script>
</body>
</html>
